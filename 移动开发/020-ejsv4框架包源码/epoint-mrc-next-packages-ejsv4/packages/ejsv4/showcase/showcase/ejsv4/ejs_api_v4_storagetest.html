<!DOCTYPE html>
<html>

    <head>
        <meta charset="UTF-8">
        <!-- 移动端的响应式特性 -->
        <meta name="viewport" content="initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <title>读取</title>

        <script>
            document.write("<script src='../../js/cssboot.js?" + Math.random() + "'></scr" + "ipt>");
        </script>
        <script>
            SrcBoot.output([
                './_common/common.css'
            ]);
        </script>

    </head>

    <body>
        <div class="mui-content pt0" id="ejs-app">

        </div>
        <script>
            document.write("<script src='../../js/jsboot.js?" + Math.random() + "'></scr" + "ipt>");
        </script>
        <script>
            "use strict";

            Util.loadJs(
                './_common/bizlogic_common_ready.js',
                function() {
                    Util.bizlogic.ready(initPage);
                });

            function initPage() {
                var litemplate = new Util.litemplate.listLitemplate({
                    isIndex: false,
                    title: '读取getauthcode网络日志',
                    ejsApi: [{
                        'id': 'getItem',
                        'text': '读取getauthcode网络日志并复制',
                        'evn': 'ejs_h5',
                        'runCode': function() {
                           ejs.storage.getItem({
                                key: 'ejs_getAuthCode_errorInfo',
                                success: function (result) {
                                    console.log(result['ejs_getAuthCode_errorInfo']);
                                    if (result['ejs_getAuthCode_errorInfo']) {
                                        ejs.runtime.clipboard({
                                            text: result,
                                            success: function (result) {
                                                ejs.ui.toast('复制成功')
                                            },
                                            error: function (error) { }
                                        });
                                    } else {
                                        ejs.ui.alert('暂无错误日志')
                                    }

                                },
                                error: function (error) {
                                    litemplate.showTips('失败:' + JSON.stringify(error));
                                }
                            });
                        }
                    }]});
            }
        </script>

    </body>

</html>
