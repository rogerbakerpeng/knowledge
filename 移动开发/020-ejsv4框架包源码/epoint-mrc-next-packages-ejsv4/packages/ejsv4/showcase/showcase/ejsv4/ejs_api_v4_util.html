                            success: function (result) {
                                litemplate.showTips(JSON.stringify(result));

                            error: function (error) {
                                litemplate.showTips('二维码扫描失败:' + JSON.stringify(error));

                        });

                                litemplate.showTips(JSON.stringify(result));

                            photoCount: 9,
                            // 是否显示gif图片，1：显示；0：不显示
                            showGif: 0,
                            // 是否允许预览，1：允许，0：不允许
                            previewEnabled: 1,
                            // 已选图片，json数组格式，item为元素本地地址
